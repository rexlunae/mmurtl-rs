name: Security boundaries
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nospec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build both kernel architectures
        run: make build arm64
      - name: Verify bounds and optimized speculation sequences
        run: python3 tools/test-nospec.py
      - name: Verify frame scrubbing
        run: |
          rustc --edition=2021 tools/tests/frame_allocator.rs -o /tmp/mmurtl-frame-test
          /tmp/mmurtl-frame-test
