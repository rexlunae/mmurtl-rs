name: Security boundaries
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  nospec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build both kernel architectures
        run: make build arm64
      - name: Build protected static-PIE user runtimes
        run: make user user-arm64 USER_FEATURES=runtime-tests
      - name: Verify emitted user canaries and startup order
        run: python3 tools/test-user-runtime.py
      - name: Verify bounds and optimized speculation sequences
        run: python3 tools/test-nospec.py
      - name: Verify entry register clearing and SLS barriers
        run: python3 tools/test-entry-sls.py
      - name: Verify kernel KCFI traps and branch landing pads
        run: |
          python3 tools/test-kernel-cfi.py
          rustc --edition=2021 tools/tests/cfi_policy.rs -o /tmp/mmurtl-cfi-policy-test
          /tmp/mmurtl-cfi-policy-test
      - name: Verify kernel stack frame budgets and guarded layout
        run: |
          python3 tools/test-stack-sizes.py
          rustc --edition=2021 tools/tests/stack_layout.rs -o /tmp/mmurtl-stack-layout-test
          /tmp/mmurtl-stack-layout-test
      - name: Verify frame scrubbing
        run: |
          rustc --edition=2021 tools/tests/frame_allocator.rs -o /tmp/mmurtl-frame-test
          /tmp/mmurtl-frame-test
      - name: Verify CPU policy and heterogeneous capability intersection
        run: |
          rustc --edition=2021 tools/tests/cpu_policy.rs -o /tmp/mmurtl-cpu-policy
          /tmp/mmurtl-cpu-policy
      - name: Verify store-bypass policy and control preservation
        run: |
          rustc --edition=2021 tools/tests/store_bypass.rs -o /tmp/mmurtl-store-bypass
          /tmp/mmurtl-store-bypass
      - name: Verify cryptographic vectors and entropy policy
        run: MMURTL_USER_TESTS=1 python3 tools/test-random.py
      - name: Verify virtqueue descriptor ownership
        run: |
          rustc --edition=2021 tools/tests/virtqueue_ownership.rs -o /tmp/mmurtl-vq-test
          /tmp/mmurtl-vq-test
      - name: Verify vendor microcode parsers
        run: |
          rustc --edition=2021 tools/tests/microcode.rs -o /tmp/mmurtl-ucode-test
          /tmp/mmurtl-ucode-test
      - name: Verify ASID generations and live CPU reservations
        run: |
          rustc --edition=2021 tools/tests/asids.rs -o /tmp/mmurtl-asid-test
          /tmp/mmurtl-asid-test
      - name: Verify ARM PAN capabilities and return flags
        run: |
          rustc --edition=2021 tools/tests/arm_pan.rs -o /tmp/mmurtl-pan-test
          /tmp/mmurtl-pan-test
      - name: Verify KASLR placement ranges
        run: |
          rustc --edition=2021 tools/tests/kaslr.rs -o /tmp/mmurtl-kaslr-test
          /tmp/mmurtl-kaslr-test
      - name: Verify x86 access-protection intersection
        run: |
          rustc --edition=2021 tools/tests/x86_access.rs -o /tmp/mmurtl-x86-access-test
          /tmp/mmurtl-x86-access-test
      - name: Verify topology and SMT admission
        run: |
          rustc --edition=2021 tools/tests/topology.rs -o /tmp/mmurtl-topology-test
          /tmp/mmurtl-topology-test
      - name: Verify ARM predictor policy and vector layouts
        run: |
          rustc --edition=2021 tools/tests/arm_predictor.rs -o /tmp/mmurtl-arm-predictor-test
          /tmp/mmurtl-arm-predictor-test
          python3 tools/test-arm-predictor.py
