[package]
name = "mmurtl-rs"
version = "0.1.0"
edition = "2021"
description = "MMURTL/RS - Message-passing multitasking real-time kernel in Rust"

[dependencies]
spin = "0.9"
volatile = "0.4"
heapless = "0.8"
chacha20 = { version = "0.10.2", default-features = false, features = ["cipher", "zeroize"] }
blake2 = { version = "0.10.6", default-features = false }

# amd64 port only
[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader_api = "0.11.15"
x86_64 = "=0.14.13"
uart_16550 = "0.2"
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }

[build-dependencies]
bootloader = "0.11.15"

[features]
default = ["stack-erase"]
# Clear inactive kernel stack bytes before every return to user mode.
stack-erase = []
# Explicit opt-in: raw kernel addresses in diagnostic logs defeat KASLR.
debug-addresses = []
# Regression image: enter the fatal machine-check path instead of starting the shell.
test-machine-check = []
# Regression image: deliberately overflow a guarded task stack.
test-stack-overflow = []
# Regression instrumentation: observe entry offsets and a seeded stack region.
test-stack-state = []
# Regression image: make a compiler-instrumented wrong-type indirect call.
test-cfi = []
# Regression images: attempt a non-landing-pad branch when hardware exists.
test-bti = []
test-ibt = []
test-kernel-canary = []
test-pac = []
test-shadow-overflow = []
# Regression only: treat all entropy sources as uncredited.
test-weak-entropy = []
test-psci-failure = []
test-heap-churn = []
test-heap-oom = []
kfence = []
test-kfence = ["kfence"]
test-retpoline-landing = []
