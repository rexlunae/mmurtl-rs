# build-std and target are handled by the Makefile for the kernel.
# Do not set them here — they break the host-binary image-builder tool.

# arm64 kernel: a position-independent executable that relocates itself
# at boot (see src/arch/arm64/boot.rs), so loaders may place it anywhere
[target.aarch64-unknown-none-softfloat]
rustflags = ["--cfg", 'chacha20_backend="soft"', "-C", "target-feature=+harden-sls-retbr,+harden-sls-blr,+harden-sls-nocomdat", "-C", "relocation-model=pie", "-C", "link-arg=-pie", "-C", "link-arg=--no-dynamic-linker"]

# Kernel FP/SIMD state is disabled; cryptography must use scalar code.
[target.x86_64-unknown-none]
rustflags = ["--cfg", 'chacha20_backend="soft"', "-C", "target-feature=+harden-sls-ret,+harden-sls-ijmp"]
